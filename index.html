<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <!-- 0 秒后跳转到目标页面，将 url 替换为实际地址 -->
    <meta http-equiv="refresh" content="0; url=https://www.example.com">
    <title>正在跳转...</title>
</head>
<body>
    <!-- 可选：提示用户，若自动跳转失败可手动点击 -->
    <p>页面正在跳转，若未响应请 <a href="https://www.example.com">点击此处</a>。</p>
</body>
</html>
